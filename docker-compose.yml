version: '3.8'

services:
  telegram-reel-bot:
    build: .
    container_name: telegram_reel_maker_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
